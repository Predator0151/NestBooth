<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Layar Antrian — KasirKita</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 82% 10%,#27698e 0,#102b46 39%,#081c30 100%);font-family:Inter,system-ui,sans-serif;color:#fff;overflow:hidden}.top{height:15vh;padding:4.2vh 6vw;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ffffff22}.brand{font-weight:800;font-size:clamp(20px,2.3vw,36px)}.brand i{font-style:normal;background:#1c92ff;padding:.18em .44em;border-radius:.28em;margin-right:.3em}.clock{color:#d7e9f7;font-size:clamp(18px,2vw,30px)}main{min-height:75vh;display:grid;grid-template-columns:1.4fr .9fr;align-items:center;padding:4vh 7vw;gap:5vw}.label{letter-spacing:.16em;text-transform:uppercase;font-size:clamp(15px,1.7vw,25px);color:#a9cbe2}.number{font-size:clamp(120px,20vw,300px);line-height:.88;font-weight:900;color:#71e4b5;letter-spacing:-.06em;margin:2.5vh 0}.customer{font-size:clamp(24px,3vw,46px);font-weight:700}.side{background:#ffffff10;border:1px solid #ffffff22;border-radius:2vw;padding:4vh 3vw}.side h2{font-size:clamp(19px,2vw,31px);margin:0 0 3vh;color:#ddecf8}.next{font-size:clamp(60px,8vw,130px);font-weight:850;color:#fff}.hint{font-size:clamp(15px,1.4vw,22px);color:#bcd4e8;margin-top:1vh}.bottom{height:10vh;background:#071827aa;display:flex;align-items:center;padding:0 6vw;color:#c7ddeb;font-size:clamp(14px,1.6vw,24px)}.dot{display:inline-block;width:.65em;height:.65em;border-radius:99px;background:#4ce198;margin-right:.55em;box-shadow:0 0 12px #4ce198}@media(max-width:600px){main{grid-template-columns:1fr;text-align:center;padding:5vh 6vw;gap:2vh}.side{padding:2vh}.number{font-size:30vw}.top{height:13vh}.bottom{height:9vh}}
  </style>
</head>
<body><header class="top"><div class="brand"><i>K</i>KasirKita</div><div id="clock" class="clock"></div></header><main><section><div class="label">Nomor sedang dipanggil</div><div id="number" class="number">A001</div><div id="customer" class="customer">Andi Saputra</div></section><section class="side"><h2>Nomor Berikutnya</h2><div id="next" class="next">A002</div><div class="hint">Silakan menunggu panggilan</div></section></main><footer class="bottom"><span class="dot"></span><span id="status">Tersambung ke sistem antrian</span></footer>
<script>
let last='';
function draw(data){const list=data.queue||[],now=list[data.current||0],next=list.slice((data.current||0)+1).find(x=>x.status==='Menunggu');number.textContent=now?.n||'—';customer.textContent=now?.name||'Tidak ada antrian';nextEl.textContent=next?.n||'—';const key=now?.n||'';if(key&&key!==last){last=key;try{speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance('Nomor antrian '+key+', silakan menuju kasir.'))}catch(e){}}}
async function poll(){try{const r=await fetch('/api/queue',{cache:'no-store'});if(!r.ok)throw Error();draw(await r.json());status.textContent='Tersambung ke sistem antrian'}catch(e){status.textContent='Menunggu koneksi ke sistem kasir'}finally{setTimeout(poll,1500)}}
function time(){clock.textContent=new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})}const nextEl=document.getElementById('next');time();setInterval(time,1000);poll();
</script></body></html>
